services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rebeautifier
      POSTGRES_USER: rebeautifier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rebeautifier}
    # Bind to loopback only — for host-side pg_dump / local tooling.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebeautifier -d rebeautifier"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/rebeautifier
      DATABASE_USERNAME: rebeautifier
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-rebeautifier}
      COVER_STORAGE_PATH: /app/data/covers
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_MAX_CONCURRENT: ${OLLAMA_MAX_CONCURRENT:-1}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - covers:/app/data/covers
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    restart: unless-stopped

volumes:
  pgdata:
  covers:
  ollama:
