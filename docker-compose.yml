services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rebeautifier
      POSTGRES_USER: rebeautifier
      POSTGRES_PASSWORD: rebeautifier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebeautifier -d rebeautifier"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8080:8080"
    # Cloud agent Docker bridge may block container-to-container TCP; reach
    # Postgres (and optional Ollama) via the published host port using host-gateway.
    extra_hosts:
      - "db:host-gateway"
      - "ollama:host-gateway"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/rebeautifier
      DATABASE_USERNAME: rebeautifier
      DATABASE_PASSWORD: rebeautifier
      COVER_STORAGE_PATH: /app/data/covers
      SEED_DEMO_DATA: "true"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_MAX_CONCURRENT: ${OLLAMA_MAX_CONCURRENT:-1}
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      all_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - covers:/app/data/covers
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  covers:
  ollama:
