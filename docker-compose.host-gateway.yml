# Optional override for environments where container-to-container DNS/TCP is
# broken (some cloud agent / nested Docker bridges). Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.host-gateway.yml up --build
#
# Publishes DB/Ollama on the host and remaps service names to host-gateway
# so the API container can reach them when Compose DNS is broken.
services:
  db:
    ports:
      - "5432:5432"

  ollama:
    ports:
      - "11434:11434"

  api:
    extra_hosts:
      - "db:host-gateway"
      - "ollama:host-gateway"
    environment:
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      all_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
