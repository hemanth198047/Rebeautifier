name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rebeautifier_test
          POSTGRES_USER: rebeautifier
          POSTGRES_PASSWORD: rebeautifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rebeautifier -d rebeautifier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: ./mvnw -B test

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
