spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rebeautifier_test
    username: rebeautifier
    password: rebeautifier
  jpa:
    hibernate:
      ddl-auto: validate
rebeautifier:
  seed-demo-data: false
  cover-storage-path: ${java.io.tmpdir}/rebeautifier-test-covers
  rate-limit:
    auth-per-minute: 1000
    ai-per-minute: 1000
  ollama:
    mock-enabled: true
    model: llama3.2:1b
    max-concurrent: 1
